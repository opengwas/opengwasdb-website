name: Build

# Builds the whole site from the small test catalogue on every pull request,
# runs the tests, checks every internal link, and tests the Data page's
# search in headless Chromium. A PR that breaks the site
# fails here, before it is merged. Publishing happens on the OpenGWAS server,
# not here: see CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs exactly what pixi.lock pins; fails if pixi.toml and
      # pixi.lock have drifted apart.
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true
          environments: default browser
      - name: Tests
        run: pixi run test
      - name: Build the site from the test catalogue
        run: pixi run build --catalog tests/fixtures/catalog
      - name: Check internal links
        run: pixi run check
      - name: Install headless Chromium
        run: pixi run -e browser python -m playwright install --with-deps chromium
      - name: Test the Data page search in a browser
        run: pixi run -e browser test-browser
