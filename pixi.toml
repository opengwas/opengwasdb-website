[workspace]
name = "opengwasdb-website"
description = "The opengwas.io static site: Markdown and the Analysis Catalog in, HTML out"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
jinja2 = ">=3.1"
markdown-it-py = ">=3.0"
mdit-py-plugins = ">=0.4"
pyyaml = ">=6.0"
pytest = ">=8.0"

[tasks]
# Build the whole site into _site/. The catalogue defaults to the OpenGWAS
# server's copy; pass --catalog PATH (or set OPENGWAS_CATALOG) elsewhere.
build = "python -m sitegen build"
# Build, serve at http://localhost:8000/, and rebuild when a file changes.
serve = "python -m sitegen serve"
# Check that every internal link in _site/ points at a page that exists.
check = "python -m sitegen check"
test = "python -m pytest -q tests --ignore=tests/browser"
# Server only: refresh data/benchmarks.json from the opengwasdb benchmark
# reports and the Store sizes on disk.
collect-benchmarks = "python scripts/collect_benchmarks.py"
# Server only: rebuild the small test catalogue in tests/fixtures/catalog/.
make-fixture = "python scripts/make_fixture_catalog.py"

# Browser tests: drive the Data page's search in headless Chromium.
#   pixi run -e browser install-browser   (once)
#   pixi run -e browser test-browser
[feature.browser.dependencies]
playwright-python = ">=1.40"

[feature.browser.tasks]
install-browser = "python -m playwright install chromium"
test-browser = "python -m pytest -q tests/browser"
# Make the logo, favicon and link-preview image from the designer's logo SVGs:
#   pixi run -e browser make-brand PATH/TO/opengwas-logo-v2
make-brand = "python scripts/make_brand_assets.py"

# The web server (nginx) for hosting the built site; see deploy/README.md.
[feature.web.dependencies]
nginx = ">=1.30"

[feature.web.tasks]
web-start = "python deploy/web.py start"
web-stop = "python deploy/web.py stop"
web-reload = "python deploy/web.py reload"
web-status = "python deploy/web.py status"

[environments]
browser = ["browser"]
web = ["web"]
